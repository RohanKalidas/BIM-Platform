[project]
name = "bim-platform"
version = "0.1.0"
description = "AI-driven IFC building generation across arbitrary architectural typology"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.5.0",
    "ifcopenshell>=0.7.0",
    "psycopg2-binary>=2.9.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
design = [
    # Filled in week 7. Will include openai client + image embedding lib.
]
translate = [
    # Filled in week 9. Will include image-processing libs.
]

[project.scripts]
bim = "bim_platform.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bim_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
